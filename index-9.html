<style>
  :root{
    --ink:#1A2233;
    --ink-soft:#4B5566;
    --paper:#F3F4F1;
    --panel:#FFFFFF;
    --line:#DCDFE3;
    --line-strong:#B9BFC7;
    --primary:#1E3A5F;
    --primary-dark:#132A44;
    --primary-tint:#E7ECF2;
    --accent:#B9903A;
    --accent-tint:#F5EBD6;
    --success:#2F7A4F;
    --success-tint:#E4F1E9;
    --warning:#A9701C;
    --warning-tint:#F6EBD9;
    --danger:#B33636;
    --danger-tint:#F6E4E4;
    --shadow:0 1px 2px rgba(20,30,50,.06);
    --font:'Tajawal', system-ui, sans-serif;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --ink:#EAEDF2;
      --ink-soft:#AEB6C2;
      --paper:#12161E;
      --panel:#1A2029;
      --line:#2A313D;
      --line-strong:#3A4250;
      --primary:#5C86B4;
      --primary-dark:#7CA3CC;
      --primary-tint:#1D2A3B;
      --accent:#D6B36A;
      --accent-tint:#2C2416;
      --success:#5FAE7E;
      --success-tint:#17261D;
      --warning:#D6A253;
      --warning-tint:#2B2313;
      --danger:#E08080;
      --danger-tint:#2B1919;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
      --ink:#EAEDF2;
      --ink-soft:#AEB6C2;
      --paper:#12161E;
      --panel:#1A2029;
      --line:#2A313D;
      --line-strong:#3A4250;
      --primary:#5C86B4;
      --primary-dark:#7CA3CC;
      --primary-tint:#1D2A3B;
      --accent:#D6B36A;
      --accent-tint:#2C2416;
      --success:#5FAE7E;
      --success-tint:#17261D;
      --warning:#D6A253;
      --warning-tint:#2B2313;
      --danger:#E08080;
      --danger-tint:#2B1919;
      --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{font-family:inherit; color:inherit}
  .shell{display:flex; min-height:100vh}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:252px; flex:0 0 252px;
    background:var(--primary-dark);
    color:#EFF3F8;
    display:flex; flex-direction:column;
    padding:22px 16px;
    gap:22px;
  }
  .brand{display:flex; flex-direction:column; align-items:stretch; gap:10px; padding:0 4px}
  .brand-text{text-align:center}
  .logo-plate{background:#fff; border-radius:12px; padding:8px 12px; display:flex; justify-content:center; align-items:center}
  .logo-plate img{display:block; height:auto}
  .brand .logo-plate img{width:100%; max-height:96px; object-fit:contain}
  .seal{
    width:44px; height:44px; border-radius:50%;
    border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center;
    flex:0 0 44px;
    position:relative;
  }
  .seal::before{
    content:'';
    position:absolute; inset:4px;
    border:1px solid rgba(185,144,58,.55);
    border-radius:50%;
  }
  .seal span{font-size:15px; font-weight:900; color:var(--accent)}
  .brand-text .t1{font-size:14px; font-weight:700; line-height:1.35}
  .brand-text .t2{font-size:11px; color:#AEBBCB; margin-top:2px}

  .nav{display:flex; flex-direction:column; gap:4px}
  .nav button{
    display:flex; align-items:center; gap:10px;
    background:transparent; border:none;
    color:#C9D4E2; text-align:right;
    padding:10px 12px; border-radius:8px;
    font-size:14px; font-weight:500; cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .nav button:hover{background:rgba(255,255,255,.06); color:#fff}
  .nav button.active{background:var(--accent); color:#241C0C; font-weight:700}
  .nav button svg{width:17px; height:17px; flex:0 0 17px}
  .nav .grp-label{font-size:10.5px; color:#8493A6; letter-spacing:.02em; margin:10px 4px 0}

  .sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.1)}
  .sidebar-foot .name{font-size:12.5px; font-weight:700; color:#E4E9F0}
  .sidebar-foot .role{font-size:11px; color:#93A2B6; margin-top:1px}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:26px 30px 60px; max-width:1180px}
  .page-head{margin-bottom:20px}
  .page-head h1{font-size:21px; font-weight:900; margin:0 0 4px}
  .page-head p{font-size:13px; color:var(--ink-soft); margin:0; max-width:640px; line-height:1.7}

  .panel{
    background:var(--panel); border:1px solid var(--line);
    border-radius:10px; box-shadow:var(--shadow);
  }
  .panel + .panel{margin-top:16px}
  .panel-head{
    padding:14px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .panel-head h2{font-size:14.5px; font-weight:700; margin:0}
  .panel-body{padding:18px}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
  .field label{font-size:12.5px; font-weight:700; color:var(--ink-soft)}
  .field .hint{font-size:11px; color:var(--ink-soft); font-weight:400}
  input[type=text], input[type=email], input[type=tel], input[type=password], input[type=date], input[type=time], input[type=month], select, textarea{
    border:1px solid var(--line-strong); background:var(--paper);
    color:var(--ink); border-radius:7px; padding:9px 11px;
    font-size:13.5px; width:100%; outline:none;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint)}
  textarea{resize:vertical; min-height:90px; line-height:1.7}

  .btn{
    display:inline-flex; align-items:center; gap:7px; justify-content:center;
    border-radius:7px; border:1px solid transparent; cursor:pointer;
    font-size:13px; font-weight:700; padding:9px 16px; white-space:nowrap;
    text-decoration:none;
  }
  .btn svg{width:15px; height:15px}
  .btn-primary{background:var(--primary); color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-accent{background:var(--accent); color:#241C0C}
  .btn-accent:hover{filter:brightness(1.05)}
  .btn-ghost{background:transparent; border-color:var(--line-strong); color:var(--ink)}
  .btn-ghost:hover{background:var(--primary-tint)}
  .btn-danger-ghost{background:transparent; border-color:var(--line-strong); color:var(--danger)}
  .btn-danger-ghost:hover{background:var(--danger-tint)}
  .btn-sm{padding:6px 11px; font-size:12px}
  .btn:disabled{opacity:.45; cursor:not-allowed}

  table{width:100%; border-collapse:collapse; font-size:13px}
  th{
    text-align:right; font-size:11.5px; color:var(--ink-soft); font-weight:700;
    padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top}
  tr:last-child td{border-bottom:none}
  .table-wrap{overflow-x:auto}
  .muted{color:var(--ink-soft)}
  .empty{padding:32px 18px; text-align:center; color:var(--ink-soft); font-size:13px}

  .pill{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px;
  }
  .pill-wait{background:var(--warning-tint); color:var(--warning)}
  .pill-done{background:var(--success-tint); color:var(--success)}
  .pill-cancel{background:var(--danger-tint); color:var(--danger)}
  .pill-dot{width:6px; height:6px; border-radius:50%; background:currentColor}

  .chip-row{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    border:1px solid var(--line-strong); background:var(--panel);
    border-radius:8px; padding:8px 12px; font-size:12.5px; font-weight:600;
    cursor:pointer; text-align:right;
  }
  .chip:hover{border-color:var(--primary)}
  .chip.selected{border-color:var(--primary); background:var(--primary-tint); color:var(--primary-dark)}

  .search{position:relative}
  .search svg{position:absolute; right:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-soft)}
  .search input{padding-right:34px}

  .compose-grid{display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start}
  .emp-list{max-height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:6px}
  .emp-item{
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer;
    display:flex; flex-direction:column; gap:2px;
  }
  .emp-item:hover{border-color:var(--primary)}
  .emp-item.selected{border-color:var(--primary); background:var(--primary-tint)}
  .emp-item .nm{font-size:13.5px; font-weight:700}
  .emp-item .jb{font-size:11.5px; color:var(--ink-soft)}

  .letter{
    background:var(--paper); border:1px dashed var(--line-strong); border-radius:8px;
    padding:20px 22px; font-size:13.5px; line-height:2.05; white-space:pre-wrap;
  }
  .letter-box{background:var(--paper); border:1px dashed var(--line-strong); border-radius:8px; padding:16px 22px 20px}
  .letter-box .letter{background:none; border:none; padding:0}
  .letter-logo{display:flex; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:12px}
  .letter-logo .logo-plate{padding:6px 12px}
  .letter-logo img{height:56px; width:auto}
  .letter .lhead{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft); margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:10px}
  .letter .lsubj{font-weight:800; margin-bottom:10px}

  .div-toggle{display:flex; gap:8px; margin-bottom:16px}
  .div-toggle button{
    flex:1; border:1px solid var(--line-strong); background:var(--panel); border-radius:8px;
    padding:10px 12px; text-align:right; cursor:pointer;
  }
  .div-toggle button .dn{font-size:13px; font-weight:700; display:block}
  .div-toggle button .de{font-size:11px; color:var(--ink-soft); display:block; margin-top:2px}
  .div-toggle button.active{border-color:var(--accent); background:var(--accent-tint)}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 20px; border-radius:8px;
    font-size:13px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    z-index:50; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}

  .modal-bg{
    position:fixed; inset:0; background:rgba(15,20,30,.45);
    display:none; align-items:flex-start; justify-content:center;
    padding:6vh 16px; overflow-y:auto; z-index:40;
  }
  .modal-bg.show{display:flex}
  .modal{background:var(--panel); border-radius:12px; width:100%; max-width:480px; box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .modal-head{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center}
  .modal-head h3{margin:0; font-size:15px; font-weight:800}
  .modal-head button{background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:18px; line-height:1}
  .modal-body{padding:18px 20px}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-start; gap:8px}

  .row-actions{display:flex; gap:6px; flex-wrap:wrap}


  /* ---------- Roster (icons) ---------- */
  .btn-start{background:#2F7A4F; color:#fff}
  .btn-start:hover{filter:brightness(1.08)}
  .btn-end{background:#B33636; color:#fff}
  .btn-end:hover{filter:brightness(1.08)}
  .rost-bar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--paper); font-size:12.5px}
  .rost-bar b{font-weight:800}
  .rost-sel{display:flex; align-items:center; gap:7px; cursor:pointer; font-weight:700}
  .rost-sel input{width:17px; height:17px; accent-color:var(--primary)}
  .rost-row{display:flex; align-items:center; gap:14px; padding:11px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .rost-row:last-child{border-bottom:none}
  .rost-row.is-in{background:var(--warning-tint)}
  .rost-row.is-done{background:var(--success-tint)}
  .rost-name{flex:1; min-width:170px; display:flex; flex-direction:column; gap:1px}
  .rost-name strong{font-size:13.5px}
  .rost-name span{font-size:11.5px; color:var(--ink-soft)}
  .rost-act{display:flex; align-items:center; gap:8px; min-width:112px}
  .rost-t{font-size:12.5px; font-weight:700; min-width:62px}
  .rost-d{font-size:12px; color:var(--ink-soft); min-width:62px}
  .ico-btn{
    width:40px; height:40px; flex:0 0 40px; border-radius:50%; border:none; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; color:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .12s ease, filter .12s ease;
  }
  .ico-btn svg{width:19px; height:19px}
  .ico-btn:hover:not(:disabled){transform:scale(1.08); filter:brightness(1.08)}
  .ico-start{background:#2F7A4F}
  .ico-end{background:#B33636}
  .ico-btn:disabled{cursor:default; box-shadow:none}
  .ico-btn:disabled:not(.done){opacity:.28}
  .ico-btn.done{opacity:.9}
  /* ---------- Attendance ---------- */
  .att-grid{display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px}
  .seg{display:flex; gap:6px; flex-wrap:wrap}
  .seg button{
    border:1px solid var(--line-strong); background:var(--panel); border-radius:8px;
    padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .seg button.active{background:var(--primary); color:#fff; border-color:var(--primary)}
  .ctl-row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end}
  .ctl-row .field{margin-bottom:0; min-width:170px}

  .sheet{
    background:#fff; color:#111; border:1px solid var(--line-strong);
    border-radius:4px; padding:26px 28px 30px; direction:rtl; text-align:right;
  }
  .sheet *{color:inherit}
  .sh-head{text-align:center; border-bottom:2px solid #1E3A5F; padding-bottom:12px; margin-bottom:16px}
  .sh-logo{display:block; margin:0 auto 6px; height:64px; width:auto}
  .sh-co{font-size:15px; font-weight:800; color:#1E3A5F}
  .sh-title{font-size:19px; font-weight:900; margin-top:6px}
  .sh-sub{font-size:13px; margin-top:4px}
  .sh-date{font-size:11.5px; color:#555; margin-top:6px}
  .rt{width:100%; border-collapse:collapse; font-size:12.5px}
  .rt th, .rt td{border:1px solid #888; padding:7px 6px; text-align:center; vertical-align:middle}
  .rt th{background:#E7ECF2; font-weight:800; font-size:12px}
  .rt tfoot td{background:#F3F4F1; font-weight:800}
  .rt .hj{font-size:10.5px; color:#555}
  .rt .l{text-align:center}
  .st-ok{color:#1F6B42; font-weight:700}
  .st-warn{color:#8A5A10; font-weight:700}
  .st-bad{color:#A62E2E; font-weight:700}
  .st-off{color:#666}
  .sum-line{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  .sum-box{flex:1; min-width:120px; border:1px solid #888; border-radius:4px; padding:8px 10px; text-align:center}
  .sum-box .v{font-size:16px; font-weight:900}
  .sum-box .k{font-size:11px; color:#555; margin-top:2px}
  .emp-info{display:flex; gap:20px; flex-wrap:wrap; margin-bottom:12px; font-size:13px}
  .emp-info b{font-weight:800}
  .sig-wrap{margin-top:34px; page-break-inside:avoid}
  .sig{width:260px; margin-right:auto; margin-left:0; text-align:right}
  .sig .sig-title{font-weight:800; font-size:13.5px; margin-bottom:12px}
  .sig .sig-line{font-size:12.5px; margin-bottom:12px}
  .sheet-note{font-size:11px; color:#555; margin-top:14px; line-height:1.8}

  @media (max-width: 900px){
    .att-grid{grid-template-columns:1fr}
    .compose-grid{grid-template-columns:1fr}
    .grid2{grid-template-columns:1fr}
  }
  @media (max-width: 720px){
    .shell{flex-direction:column}
    .sidebar{width:100%; flex:none; flex-direction:row; align-items:center; overflow-x:auto; padding:14px}
    .nav{flex-direction:row; overflow-x:auto}
    .nav .grp-label{display:none}
    .sidebar-foot{display:none}
    .brand-text{display:none}
    .brand{flex-direction:row; align-items:center}
    .brand .logo-plate{padding:4px 10px}
    .brand .logo-plate img{width:auto; height:36px}
    .main{padding:18px 16px 50px}
  }

  @page{ size:A4; margin:10mm }
  /* الطباعة: تُفعَّل بالصنف pm عند حدث beforeprint حتى يُقاس الارتفاع ويُضبط الحجم على صفحة واحدة */
  html.pm, html.pm body{background:#fff !important}
  html.pm .sidebar, html.pm .page-head, html.pm .no-print, html.pm .toast, html.pm .modal-bg{display:none !important}
  html.pm .shell{display:block}
  html.pm .main{padding:0 !important; max-width:none !important}
  html.pm .sheet{border:none !important; padding:0 !important; width:190mm}
  html.pm .sh-head{padding-bottom:6px; margin-bottom:8px}
  html.pm .sh-logo{height:62px; margin-bottom:3px}
  html.pm .sh-title{font-size:16px; margin-top:3px}
  html.pm .sh-sub{font-size:12px; margin-top:2px}
  html.pm .sh-date{margin-top:3px}
  html.pm .sum-line{margin-bottom:8px; gap:6px}
  html.pm .sum-box{padding:4px 6px}
  html.pm .sum-box .v{font-size:13px}
  html.pm .emp-info{margin-bottom:6px}
  html.pm .rt th, html.pm .rt td{padding:3px 4px; font-size:10.5px}
  html.pm .rt tr{page-break-inside:avoid}
  html.pm .sig-wrap{margin-top:16px}
  html.pm .sig .sig-line{margin-bottom:8px}
  html.pm .sheet-note{margin-top:8px}

  /* ---------- Employee portal ---------- */
  .nav a{display:flex; align-items:center; gap:10px; color:#C9D4E2; text-decoration:none; padding:10px 12px; border-radius:8px; font-size:14px; font-weight:500}
  .nav a:hover{background:rgba(255,255,255,.06); color:#fff}
  .nav a svg{width:17px; height:17px; flex:0 0 17px}
  #portal, #login{display:none; min-height:100vh; padding:22px 16px 40px}
  body.portal-mode #portal{display:block}
  body.login-mode #login{display:block; padding-top:9vh}
  body.portal-mode .shell, body.login-mode .shell{display:none}
  .p-wrap{max-width:440px; margin:0 auto}
  .p-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:26px 22px}
  .p-brand{text-align:center; margin-bottom:20px}
  .p-brand .logo-plate{margin:0 auto 12px; width:max-content; padding:6px 16px}
  .p-brand .logo-plate img{height:104px; width:auto}
  .p-logo{display:flex; justify-content:center; margin-bottom:12px}
  .p-logo img{height:64px; width:auto}
  .p-brand h1{font-size:21px; font-weight:900; margin:0}
  .p-brand p{font-size:13px; color:var(--ink-soft); margin:4px 0 0}
  .p-err{display:none; background:var(--danger-tint); color:var(--danger); border-radius:7px; padding:9px 11px; font-size:12.5px; font-weight:700; margin-bottom:12px}
  .p-err.show{display:block}
  .p-note{background:var(--warning-tint); color:var(--warning); border-radius:7px; padding:8px 11px; font-size:12px; font-weight:700; text-align:center; margin-bottom:14px}
  .p-who{text-align:center; margin-bottom:12px}
  .p-who strong{font-size:17px; display:block}
  .p-who span{display:inline-block; margin-top:5px; background:var(--primary-tint); color:var(--primary-dark); padding:3px 14px; border-radius:999px; font-weight:700; font-size:12.5px}
  .p-tasks{margin-top:22px}
  .p-tasks h3{font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:8px}
  .p-tasks h3.t-sub{margin-top:18px; font-size:12.5px; color:var(--ink-soft)}
  .t-count{background:var(--danger); color:#fff; border-radius:999px; font-size:11.5px; min-width:22px; padding:1px 7px; text-align:center}
  .t-card{border:1px solid var(--line-strong); background:var(--paper); border-radius:10px; padding:12px 14px; margin-bottom:10px}
  .t-card.is-done{opacity:.85}
  .t-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
  .t-head strong{font-size:13.5px; line-height:1.6}
  .t-meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px}
  .t-body{font-size:13px; line-height:1.9; margin:8px 0 10px; white-space:pre-wrap}
  .t-reply{font-size:12.5px; line-height:1.8; border-top:1px solid var(--line); padding-top:8px}
  .t-form label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px}
  .t-form textarea{margin-bottom:8px}
  .t-none{background:var(--success-tint); color:var(--success); border-radius:8px; padding:12px; text-align:center; font-size:13px; font-weight:700}
  .t-std{margin-top:14px; border:1px solid var(--line); border-radius:10px; padding:10px 14px}
  .t-std summary{cursor:pointer; font-size:13px; font-weight:700}
  .t-std-item{margin-top:10px; padding-top:10px; border-top:1px solid var(--line)}
  .t-std-item strong{font-size:12.5px}
  .t-std-item p{margin:4px 0 0; font-size:12.5px; line-height:1.9; color:var(--ink-soft)}
  .p-clock{font-size:34px; font-weight:900; text-align:center; direction:rtl; min-height:44px}
  .p-date{text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:2px}
  .p-status{text-align:center; font-size:13px; font-weight:700; margin:16px 0; min-height:20px}
  .st-ok-p{color:var(--success)}
  .p-btns{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .p-big{border:none; border-radius:14px; padding:20px 8px; color:#fff; font-size:14.5px; font-weight:800; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; line-height:1.4; text-align:center}
  .p-big svg{width:30px; height:30px}
  .p-big.go{background:#2F7A4F}
  .p-big.stop{background:#B33636}
  .p-big:disabled{opacity:.28; cursor:default}
  .p-big.confirm{outline:3px solid #F6C453}
  .p-hist{margin-top:22px}
  .p-hist h3{font-size:13px; margin:0 0 8px}
  .p-hist table{font-size:12px}
  .p-hist th, .p-hist td{text-align:center; padding:7px 4px}
  .p-foot{display:flex; justify-content:space-between; margin-top:14px; font-size:12px}
  .p-foot a, .p-foot button{color:var(--ink-soft); background:none; border:none; cursor:pointer; text-decoration:underline; font-size:12px; padding:0}
  .self-tag{display:block; font-size:10px; color:var(--ink-soft); font-weight:500}
</style>
</head>

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const base = structuredClone(defaultState);
    if(!raw) return base;
    const parsed = JSON.parse(raw);
    return { ...base, ...parsed,
      divisions: (parsed.divisions && parsed.divisions.length) ? parsed.divisions : base.divisions,
      signer: parsed.signer || base.signer,
      employees: (parsed.employees && parsed.employees.length) ? parsed.employees : base.employees,
      templates: (parsed.templates && parsed.templates.length) ? parsed.templates : base.templates,
      log: parsed.log || base.log,
      attendance: parsed.attendance || [],
      hrName: parsed.hrName || '' };
  }catch(e){
    console.error('load error', e);
    return structuredClone(defaultState);
  }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('save error', e); toast('تعذر الحفظ محليًا'); }
}
function uid(){ return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

/* ===================== Utilities ===================== */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ar-SA', { year:'numeric', month:'short', day:'numeric' }) +
    ' · ' + d.toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' });
}
function jobTitles(){
  const set = new Set(state.employees.map(e=>e.jobTitle).filter(Boolean));
  return [...set];
}
function copyText(text){
  const done = ()=> toast('تم نسخ نص البريد ✓');
  const fail = ()=>{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ toast('تعذر النسخ — انسخ يدويًا'); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fail);
  } else fail();
}

      </div>
      <div class="field"><label>عنوان المهمة</label>

      </div>

      </div>

function fillTemplate(body, emp){
  return (body||'').replaceAll('{name}', emp.name).replaceAll('{الاسم}', emp.name).replaceAll('{job}', emp.jobTitle||'').replaceAll('{الوظيفة}', emp.jobTitle||'');
}

function currentTaskText(emp){
  const subj = document.getElementById('taskSubject')?.value.trim() || '(بدون عنوان)';
  const body = document.getElementById('taskBody')?.value.trim() || '';
  return { subj, body };
}

function buildLetterPreview(emp, div){
  const subjEl = document.getElementById('taskSubject');
  const bodyEl = document.getElementById('taskBody');
  const subj = subjEl ? subjEl.value.trim() : '';
  const bodyTxt = bodyEl ? bodyEl.value.trim() : '';
  const full = composeLetterText(emp, div, subj, bodyTxt);
  return esc(full);
}

function composeLetterText(emp, div, subj, bodyTxt){
  const lines = [
    `السلام عليكم ورحمة الله وبركاته`,
    ``,
    `الأستاذ/ة ${emp.name} المحترم${emp.jobTitle ? ' — ' + emp.jobTitle : ''}`,
    ``,
    bodyTxt || '(لم تتم إضافة تفاصيل المهمة بعد)',
    ``,
    `يرجى الإفادة بالرد على هذا البريد عند إنجاز المهمة، أو في حال وجود أي استفسار بخصوصها.`,
    ``,
    `مع التقدير،`,
    `${state.signer.name}`,
    `${state.signer.title}`,
    `${div.name}`
  ];
  return lines.join('\n');
}

function wireTabEvents(){
  if(currentTab==='compose'){
    document.querySelectorAll('[data-div]').forEach(b=>{
      b.addEventListener('click', ()=>{ state.activeDivision = b.dataset.div; saveState(); render(); });
    });
    document.querySelectorAll('[data-emp]').forEach(b=>{
      b.addEventListener('click', ()=>{
        composeSelectedEmployee = b.dataset.emp;
        composeSelectedTemplate = null;
        render();
      });
    });
    document.querySelectorAll('[data-tmpl]').forEach(b=>{
      b.addEventListener('click', ()=>{
        composeSelectedTemplate = (composeSelectedTemplate === b.dataset.tmpl) ? null : b.dataset.tmpl;
        render();
      });
    });
    const su = document.getElementById('taskSubject');
    const bo = document.getElementById('taskBody');
    const refresh = document.getElementById('refreshPreview');
    if(refresh) refresh.addEventListener('click', render);
    if(su) su.addEventListener('input', updatePreviewOnly);
    if(bo) bo.addEventListener('input', updatePreviewOnly);

    const emp = state.employees.find(e=>e.id===composeSelectedEmployee);
    const div = state.divisions.find(d=>d.id===state.activeDivision) || state.divisions[0];
    const btnCopy = document.getElementById('btnCopy');
    const btnMailto = document.getElementById('btnMailto');
    const btnLog = document.getElementById('btnLog');
    if(btnCopy) btnCopy.addEventListener('click', ()=>{
      const {subj, body} = currentTaskText(emp);
      const full = `إلى: ${emp.email}\nمن: ${div.email || div.name}\nالموضوع: ${subj}\n\n${composeLetterText(emp, div, subj, body)}`;
      copyText(full);
    });
    if(btnMailto){
      updateMailtoHref(emp, div);
      btnMailto.addEventListener('click', (e)=>{
        if(!emp.email){ e.preventDefault(); toast('لا يوجد بريد إلكتروني مسجّل لهذا الموظف'); return; }
        updateMailtoHref(emp, div); // make sure href reflects latest edits right before navigating
        toast(`تأكد أن حساب البريد المفتوح هو: ${div.email || div.name}`);
      });
    }
    if(btnLog) btnLog.addEventListener('click', ()=>{
      const {subj, body} = currentTaskText(emp);
      if(!body){ toast('اكتب تفاصيل المهمة أولًا'); return; }
      state.log.unshift({
        id: uid(), employeeId: emp.id, employeeName: emp.name, employeeEmail: emp.email,
        jobTitle: emp.jobTitle, division: div.name, taskTitle: subj, taskBody: body,
        dateSent: new Date().toISOString(), status:'waiting', reply:''
      });
      saveState();
      toast('تم تسجيل المهمة في السجل ✓');
      composeSelectedTemplate = null;
      currentTab = 'log';
      document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='log'));
      render();
    });
  }
}
function updatePreviewOnly(){
  const emp = state.employees.find(e=>e.id===composeSelectedEmployee);
  const div = state.divisions.find(d=>d.id===state.activeDivision) || state.divisions[0];
  const prev = document.getElementById('letterPreview');
  if(prev && emp) prev.innerHTML = buildLetterPreview(emp, div);
  if(emp) updateMailtoHref(emp, div);
}
function updateMailtoHref(emp, div){
  const btnMailto = document.getElementById('btnMailto');
  if(!btnMailto || !emp) return;
  const {subj, body} = currentTaskText(emp);
  const full = composeLetterText(emp, div, subj, body);
  if(!emp.email){ btnMailto.removeAttribute('href'); return; }
  btnMailto.setAttribute('href', `mailto:${encodeURIComponent(emp.email)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(full)}`);
}

      ${emp?.pwd ? '<label class="rost-sel" style="margin-top:8px; font-weight:500; font-size:12.5px"><input type="checkbox" id="f_pwd_reset"> إعادة الرقم السري إلى رقم الجوال</label>' : ''}

function openEmpModal(id){
  const emp = id ? state.employees.find(e=>e.id===id) : null;
  const mgr = !!(emp && emp.isManager);
  openModal(emp?'تعديل بيانات الموظف':'إضافة موظف', employeeFormHtml(emp),
    `<button class="btn btn-primary" id="saveEmpBtn">${emp?'حفظ التعديل':'إضافة'}</button>
     <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>`);
  document.getElementById('saveEmpBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('f_name').value.trim();
    const jobTitle = document.getElementById('f_job').value.trim();
    const email = document.getElementById('f_email').value.trim();
    const phoneRaw = document.getElementById('f_phone').value.trim();
    const phone = phoneRaw ? normPhone(phoneRaw) : '';
    const nationalId = mgr ? emp.nationalId : normDigits(document.getElementById('f_nid').value);
    if(!name){ toast('الاسم مطلوب'); return; }
    if(!mgr && nationalId.length !== 10){ toast('رقم الهوية مطلوب ويجب أن يكون ١٠ أرقام'); return; }
    if((!mgr || phone) && phone.length !== 10){ toast('رقم الجوال مطلوب — مثال: 05xxxxxxxx'); return; }
    if(email && !/^\S+@\S+\.\S+$/.test(email)){ toast('البريد الإلكتروني غير صحيح'); return; }
    if(nationalId && state.employees.some(x => x.nationalId && normDigits(x.nationalId) === nationalId && (!emp || x.id !== emp.id))){ toast('رقم الهوية مسجّل لموظف آخر'); return; }
    const pwdRaw = mgr ? '' : normDigits(document.getElementById('f_pwd').value);
    const resetEl = document.getElementById('f_pwd_reset');
    let newPwd = null;
    if(pwdRaw){
      if(pwdRaw.length < 4 || pwdRaw.length > 10){ toast('الرقم السري المخصّص من ٤ إلى ١٠ أرقام'); return; }
      try{ newPwd = await makePwdCred(pwdRaw); }catch(err){ console.error(err); toast('تعذّر حفظ الرقم السري'); return; }
    }
    if(emp){
      Object.assign(emp, { name, jobTitle, email, phone, nationalId });
      if(newPwd) emp.pwd = newPwd;
      else if(resetEl && resetEl.checked) delete emp.pwd;
    } else {
      const rec = { id: uid(), name, jobTitle, email, phone, nationalId };
      if(newPwd) rec.pwd = newPwd;
      state.employees.push(rec);
    }
    saveState(); closeModal(); render();
    toast(emp ? 'تم الحفظ ✓' : 'تمت إضافة الموظف ✓ — يدخل برقم هويته ورقم جواله');
  });
}

document.getElementById('main').addEventListener('click', e=>{

  const editEmp = e.target.closest('[data-edit-emp]');
  if(editEmp){ openEmpModal(editEmp.dataset.editEmp); return; }
  const delEmp = e.target.closest('[data-del-emp]');
  if(delEmp){
    const id = delEmp.dataset.delEmp;
    state.employees = state.employees.filter(x=>x.id!==id);
    saveState(); render(); toast('تم حذف الموظف');
    return;
  }
  const addTmpl = e.target.closest('#btnAddTmpl');
  if(addTmpl){ openTmplModal(null); return; }
  const editTmpl = e.target.closest('[data-edit-tmpl]');
  if(editTmpl){ openTmplModal(editTmpl.dataset.editTmpl); return; }
  const delTmpl = e.target.closest('[data-del-tmpl]');
  if(delTmpl){
    const id = delTmpl.dataset.delTmpl;
    state.templates = state.templates.filter(x=>x.id!==id);
    saveState(); render(); toast('تم حذف المهمة');
    return;
  }
  const viewLog = e.target.closest('[data-view-log]');
  if(viewLog){ openLogModal(viewLog.dataset.viewLog); return; }

  const saveDivBtn = e.target.closest('#saveDivBtn');
  if(saveDivBtn){
    document.querySelectorAll('[data-div-name]').forEach(inp=>{
      state.divisions[+inp.dataset.divName].name = inp.value.trim();
    });
    document.querySelectorAll('[data-div-email]').forEach(inp=>{
      state.divisions[+inp.dataset.divEmail].email = inp.value.trim();
    });
    saveState(); toast('تم حفظ جهات الإرسال ✓');
    return;
  }
  const addDivBtn = e.target.closest('#addDivBtn');
  if(addDivBtn){
    state.divisions.push({ id: uid(), name:'جهة إرسال جديدة', email:'' });
    saveState(); render();
    return;
  }
  const delDiv = e.target.closest('[data-del-div]');
  if(delDiv){

    if(state.divisions.length<=1){ toast('لازم تبقى جهة إرسال واحدة على الأقل'); return; }
    document.querySelectorAll('[data-div-name]').forEach(inp=>{ state.divisions[+inp.dataset.divName].name = inp.value.trim(); });
    document.querySelectorAll('[data-div-email]').forEach(inp=>{ state.divisions[+inp.dataset.divEmail].email = inp.value.trim(); });
    if(state.activeDivision === state.divisions[idx].id){
      const fallback = state.divisions.find((d,i)=> i!==idx);
      state.activeDivision = fallback ? fallback.id : null;
    }
    state.divisions.splice(idx,1);
    saveState(); render();
    toast('تم حذف الجهة');
    return;
  }
  const saveSignerBtn = e.target.closest('#saveSignerBtn');
  if(saveSignerBtn){
    state.signer.name = document.getElementById('s_signerName').value.trim();
    state.signer.title = document.getElementById('s_signerTitle').value.trim();
    saveState(); toast('تم حفظ بيانات الموقّع ✓');
    return;
  }
});

/* ===================== Attendance & Reports ===================== */
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
function ar(v){ return String(v).replace(/\d/g, d => AR_DIGITS[d]); }
function pad2(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function nowTime(){ const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function parseDS(ds){ const [y,m,d] = ds.split('-').map(Number); return new Date(y, m-1, d); }
function dsOf(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
function toMin(t){ const [h,m] = t.split(':').map(Number); return h*60 + m; }
function isWeekend(ds){ const w = parseDS(ds).getDay(); return w === 5 || w === 6; } // الجمعة والسبت

function fmtG(ds){
  try{ return parseDS(ds).toLocaleDateString('ar-SA-u-ca-gregory-nu-arab', {day:'numeric', month:'long', year:'numeric'}); }
  catch(e){ return ar(ds); }
}
function fmtH(ds){
  try{ return parseDS(ds).toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-arab', {day:'numeric', month:'long', year:'numeric'}); }
  catch(e){ return ''; }
}
function dayName(ds){
  try{ return parseDS(ds).toLocaleDateString('ar-SA-u-ca-gregory', {weekday:'long'}); }
  catch(e){ return ''; }
}
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  try{ return new Date(y, m-1, 1).toLocaleDateString('ar-SA-u-ca-gregory-nu-arab', {month:'long', year:'numeric'}); }
  catch(e){ return ar(ym); }
}
function fmtTime(t){
  if(!t) return '—';
  let [h,m] = t.split(':').map(Number);
  const suffix = h >= 12 ? 'م' : 'ص';
  h = h % 12 || 12;
  return ar(pad2(h) + ':' + pad2(m)) + ' ' + suffix;
}
function fmtMinAsTime(min){
  const h = Math.floor(min/60) % 24, m = Math.round(min % 60);
  return fmtTime(`${pad2(h)}:${pad2(m)}`);
}
function fmtDur(min){
  if(min == null) return '—';
  const h = Math.floor(min/60), m = min % 60;
  if(h === 0) return ar(m) + ' د';
  return ar(h) + ' س ' + ar(m) + ' د';
}
function durMin(r){
  if(!r || !r.checkIn || !r.checkOut) return null;
  const d = toMin(r.checkOut) - toMin(r.checkIn);
  return d >= 0 ? d : null;
}
function attFor(empId, ds){ return state.attendance.find(r => r.employeeId === empId && r.date === ds); }

function attApply(ids, kind){
  const ds = document.getElementById('attDate').value;
  const tm = document.getElementById('attTime').value;
  if(!ids.length){ toast('حدّد موظفًا واحدًا على الأقل'); return; }
  if(!ds || !tm){ toast('حدّد التاريخ والوقت'); return; }
  let ok = 0, skip = 0;
  ids.forEach(id => {
    const emp = state.employees.find(e => e.id === id);
    if(!emp){ skip++; return; }
    const rec = attFor(id, ds);
    if(kind === 'in'){
      if(rec && rec.checkIn){ skip++; return; }
      if(rec) rec.checkIn = tm;
      else state.attendance.push({ id: uid(), employeeId: id, employeeName: emp.name, date: ds, checkIn: tm, checkOut: '', note: '' });
      ok++;
    } else {
      if(!rec || !rec.checkIn || rec.checkOut || toMin(tm) < toMin(rec.checkIn)){ skip++; return; }
      rec.checkOut = tm;
      ok++;
    }
  });
  attDate = ds; attTime = null;
  saveState(); render();
  const what = kind === 'in' ? 'بداية العمل' : 'نهاية العمل';
  if(ok === 0) toast('لم يُسجَّل أحد — سُجّل مسبقًا أو الوقت قبل وقت البداية');
  else toast(`تم تسجيل ${what} لـ ${ar(ok)}${skip ? ` — وتخطّي ${ar(skip)}` : ''} ✓`);
}

function openAttModal(id){
  const r = id ? state.attendance.find(x => x.id === id) : null;
  const html = `
    <div class="field"><label>الموظف</label>
      <select id="a_emp">${empOptions(r ? r.employeeId : attEmp)}</select></div>
    <div class="field"><label>التاريخ</label><input type="date" id="a_date" value="${r ? r.date : attDate}"></div>
    <div class="grid2">
      <div class="field"><label>وقت الحضور</label><input type="time" id="a_in" value="${r ? (r.checkIn||'') : ''}"></div>
      <div class="field"><label>وقت الانصراف <span class="hint">(اختياري)</span></label><input type="time" id="a_out" value="${r ? (r.checkOut||'') : ''}"></div>
    </div>
    <div class="field"><label>ملاحظة <span class="hint">(اختياري)</span></label><input type="text" id="a_note" value="${esc(r ? (r.note||'') : '')}"></div>`;
  openModal(r ? 'تعديل سجل الحضور' : 'إضافة سجل حضور', html,
    `<button class="btn btn-primary" id="saveAttBtn">${r ? 'حفظ التعديل' : 'إضافة'}</button>
     ${r ? '<button class="btn btn-danger-ghost" id="delAttBtn">حذف السجل</button>' : ''}
     <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>`);
  document.getElementById('saveAttBtn').addEventListener('click', () => {
    const empId = document.getElementById('a_emp').value;
    const ds = document.getElementById('a_date').value;
    const tin = document.getElementById('a_in').value;
    const tout = document.getElementById('a_out').value;
    const note = document.getElementById('a_note').value.trim();
    const emp = state.employees.find(e => e.id === empId);
    if(!emp){ toast('اختر الموظف'); return; }
    if(!ds || !tin){ toast('التاريخ ووقت الحضور مطلوبان'); return; }
    if(tout && toMin(tout) < toMin(tin)){ toast('وقت الانصراف قبل وقت الحضور'); return; }

    if(dup){ toast('يوجد سجل لهذا الموظف في نفس اليوم — عدّله بدل إضافة جديد'); return; }
    if(r){ Object.assign(r, { employeeId: empId, employeeName: emp.name, date: ds, checkIn: tin, checkOut: tout, note }); }
    else state.attendance.push({ id: uid(), employeeId: empId, employeeName: emp.name, date: ds, checkIn: tin, checkOut: tout, note });
    attDate = ds; attEmp = empId;
    saveState(); closeModal(); render(); toast('تم الحفظ ✓');
  });
  const del = document.getElementById('delAttBtn');
  if(del) del.addEventListener('click', () => {
    state.attendance = state.attendance.filter(x => x.id !== r.id);
    saveState(); closeModal(); render(); toast('تم حذف السجل');
  });
}

/* ---------- Tab: كشف الحضور ---------- */
function workDaysIn(ym){
  const [y,m] = ym.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  const t = todayStr(), out = [];
  for(let d = 1; d <= last; d++){
    const ds = dsOf(y,m,d);
    if(ds > t) break;
    if(!isWeekend(ds)) out.push(ds);
  }
  return out;
}
function empStats(emp, ym){
  const recs = state.attendance.filter(r => r.employeeId === emp.id && r.date.startsWith(ym));
  const wd = workDaysIn(ym);
  const absent = wd.filter(ds => !recs.some(r => r.date === ds)).length;
  const withDur = recs.map(durMin).filter(x => x != null);
  const total = withDur.reduce((a,b) => a+b, 0);
  const ins = recs.filter(r => r.checkIn).map(r => toMin(r.checkIn));
  const outs = recs.filter(r => r.checkOut).map(r => toMin(r.checkOut));
  const avg = a => a.length ? a.reduce((x,y) => x+y, 0) / a.length : null;
  return {
    recs, attended: recs.length, absent, noOut: recs.filter(r => !r.checkOut).length,
    total, avgDur: withDur.length ? Math.round(total / withDur.length) : null,
    avgIn: avg(ins), avgOut: avg(outs)
  };
}

function buildEmployeeSheet(){
  const emp = state.employees.find(e => e.id === repEmp);
  if(!emp) return `<div class="empty" style="color:#555">اختر موظفًا لعرض تقرير حضوره وانصرافه</div>`;
  const s = empStats(emp, repMonth);
  const [y,m] = repMonth.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  const t = todayStr();
  let body = '';
  for(let d = 1; d <= last; d++){
    const ds = dsOf(y,m,d);
    const r = attFor(emp.id, ds);
    const future = ds > t;
    body += `<tr>
      <td>${ar(d)}</td>
      <td>${dayName(ds)} ${fmtG(ds)}</td>
      <td>${fmtH(ds)}</td>
      <td>${r ? fmtTime(r.checkIn) : '—'}</td>
      <td>${r && r.checkOut ? fmtTime(r.checkOut) : '—'}</td>
      <td>${fmtDur(durMin(r))}</td>
      <td>${future && !r ? '<span class="st-off">—</span>' : dailyStatus(r, ds)}</td>
    </tr>`;
  }
  return `
    ${sheetHead('تقرير حضور وانصراف موظف', `شهر ${monthLabel(repMonth)}`)}

      <div><b>الاسم:</b> ${esc(emp.name)}</div>

      <div class="sum-box"><div class="v">${s.avgIn != null ? fmtMinAsTime(s.avgIn) : '—'}</div><div class="k">متوسط وقت الحضور</div></div>
      <div class="sum-box"><div class="v">${s.avgOut != null ? fmtMinAsTime(s.avgOut) : '—'}</div><div class="k">متوسط وقت الانصراف</div></div>

      <thead><tr><th>م</th><th>اليوم والتاريخ</th><th>التاريخ الهجري</th><th>الحضور</th><th>الانصراف</th><th>المدة</th><th>الحالة</th></tr></thead>

/* ---------- Events ---------- */
(function wireAttendance(){
  const main = document.getElementById('main');
  main.addEventListener('click', e => {
    const act = e.target.closest('[data-att-act]');
    if(act){
      const d = document.getElementById('attDate'); if(d && d.value) attDate = d.value;
      openAttModal(null);
      return;
    }
    const bin = e.target.closest('[data-att-in]');
    if(bin){ attApply([bin.dataset.attIn], 'in'); return; }
    const bout = e.target.closest('[data-att-out]');
    if(bout){ attApply([bout.dataset.attOut], 'out'); return; }
    const ball = e.target.closest('[data-att-all]');
    if(ball){ attApply([...selSet()].filter(id => state.employees.some(e2 => e2.id === id)), ball.dataset.attAll); return; }
    const bnew = e.target.closest('[data-att-new]');
    if(bnew){ attEmp = bnew.dataset.attNew; const d = document.getElementById('attDate'); if(d && d.value) attDate = d.value; openAttModal(null); return; }
    const ed = e.target.closest('[data-att-edit]');
    if(ed){ openAttModal(ed.dataset.attEdit); return; }
    const md = e.target.closest('[data-rep-mode]');
    if(md){ repMode = md.dataset.repMode; render(); return; }
    if(e.target.closest('#repPrint')){
      try{ window.print(); resetAfterPrint(); }

      return;
    }
  });
  main.addEventListener('change', e => {
    const id = e.target.id;
    if(id === 'attDate'){ attDate = e.target.value || todayStr(); render(); }
    else if(id === 'attTime'){ attTime = e.target.value || null; }

      render();
    }
    else if(e.target.dataset && e.target.dataset.attSel){
      const sel = selSet();
      if(e.target.checked) sel.add(e.target.dataset.attSel); else sel.delete(e.target.dataset.attSel);
      render();
    }
    else if(id === 'repDate'){ repDate = e.target.value || todayStr(); render(); }
    else if(id === 'repMonth'){ repMonth = e.target.value || todayStr().slice(0,7); render(); }
    else if(id === 'repEmp'){ repEmp = e.target.value; render(); }
    else if(id === 'hrName'){ state.hrName = e.target.value.trim(); saveState(); render(); }
  });
  main.addEventListener('input', e => {

    }

})();

/* ===================== Print fit (one A4 page) ===================== */
function fitSheetForPrint(){
  const sheet = document.getElementById('reportSheet');
  if(!sheet) return;
  const root = document.documentElement;
  root.classList.add('pm');
  sheet.style.zoom = ''; sheet.style.width = '';
  const avail = ((277 / 25.4) * 96) * 0.95; // ارتفاع A4 ناقص الهوامش بالبكسل مع هامش أمان ٥٪
  const h = sheet.offsetHeight;
  const s = h > avail ? Math.max(0.5, avail / h) : 1;
  if(s < 1){ sheet.style.zoom = s; sheet.style.width = (190 / s) + 'mm'; }
}
function resetAfterPrint(){
  document.documentElement.classList.remove('pm');
  const sheet = document.getElementById('reportSheet');
  if(sheet){ sheet.style.zoom = ''; sheet.style.width = ''; }
}
window.addEventListener('beforeprint', fitSheetForPrint);
window.addEventListener('afterprint', resetAfterPrint);

function normDigits(s){
  return String(s || '')
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/\D/g, '');
}
function normPhone(s){
  let p = normDigits(s);
  if(p.startsWith('00966')) p = p.slice(5);
  else if(p.startsWith('966')) p = p.slice(3);
  if(p.length === 9 && p[0] === '5') p = '0' + p;
  return p;
}

/* ---------- الجلسة (تنتهي بإغلاق التبويب) ---------- */
const SESS_KEY = 'taj_session_v1';
let memSession = null;
function getSession(){
  if(memSession) return memSession;
  try{ const r = sessionStorage.getItem(SESS_KEY); if(r) memSession = JSON.parse(r); }catch(e){}
  return memSession;
}
function setSession(s){

}

/* ---------- بيانات دخول الإدارة: تُحفظ كبصمة PBKDF2 ولا تُحفظ مقروءة ---------- */
const DEFAULT_ADMIN = { salt: '4b93c1e5b9bf0f4b110e4cc7996a1800', iter: 150000, hash: '700664373e3eb24f6189c8d4b39d1c11ab760f1e1b0cd48afcc92b0c94db591e' };
const ADMIN_KEY = 'taj_admin_cred_v1';
function adminCred(){
  try{ const r = localStorage.getItem(ADMIN_KEY); if(r) return JSON.parse(r); }catch(e){}
  return DEFAULT_ADMIN;
}
function toHex(buf){ return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''); }
function fromHex(h){ return new Uint8Array(h.match(/.{2}/g).map(x => parseInt(x, 16))); }
async function derive(secret, saltHex, iter){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: fromHex(saltHex), iterations: iter, hash: 'SHA-256' }, key, 256);
  return toHex(bits);
}
function credString(id, pass){ return normDigits(id) + '|' + normDigits(pass); }
async function checkAdmin(id, pass){
  const c = adminCred();
  // يقبل الرقم كما كُتب، أو بصيغة الجوال (+966...) للتوافق مع بيانات الدخول الأولى
  const cands = [...new Set([normDigits(pass), normPhone(pass)])].filter(Boolean);
  for(const cand of cands){
    if((await derive(normDigits(id) + '|' + cand, c.salt, c.iter)) === c.hash) return true;
  }
  return false;
}
async function makeCred(id, pass){
  const salt = toHex(crypto.getRandomValues(new Uint8Array(16)));
  return { salt, iter: 150000, hash: await derive(credString(id, pass), salt, 150000) };
}
/* رقم سري مخصّص يضعه المدير لموظف بدل رقم جواله (يُحفظ كبصمة ولا يُقرأ) */
async function makePwdCred(pwd){
  const salt = toHex(crypto.getRandomValues(new Uint8Array(16)));
  return { salt, iter: 150000, hash: await derive(normDigits(pwd), salt, 150000) };
}
/* الرقم السري للموظف: رقم جواله، إلا إذا حدّد له المدير رقمًا مخصّصًا */
async function checkEmployeePwd(emp, pass){
  const p = normDigits(pass);
  if(!p) return false;
  if(emp.pwd) return (await derive(p, emp.pwd.salt, emp.pwd.iter)) === emp.pwd.hash;
  const ph = normPhone(emp.phone);
  return !!ph && normPhone(p) === ph;
}


/* المدير موظف أيضًا: يُنشأ سجله عند أول دخول ناجح ليسجّل حضوره من واجهة الموظف */
function ensureManagerEmployee(id){
  let m = state.employees.find(e => e.isManager);
  if(!m){
    m = { id: 'emp_manager', name: state.signer.name, jobTitle: state.signer.title,
          email: (state.divisions[0] && state.divisions[0].email) || '', phone: '', nationalId: id, isManager: true };
    state.employees.unshift(m);
  } else { m.nationalId = id; }
  saveState();
}

const LOCK_KEY = 'taj_login_lock_v1';
function getLock(){ try{ return JSON.parse(localStorage.getItem(LOCK_KEY) || '{}'); }catch(e){ return {}; } }

function renderLogin(){
  document.getElementById('login').innerHTML = `
  <div class="p-wrap">
    <div class="p-card">
      <div class="p-brand">
        <div class="logo-plate">${logoImg()}</div>
        <h1>شركة تاج العزيزية</h1>

      </div>

          <input type="text" id="l_id" inputmode="numeric" dir="ltr" maxlength="10" placeholder="١٠ أرقام" autocomplete="off"></div>
        <div class="field"><label>رقم الجوال (الرقم السري)</label>
          <input type="password" id="l_pwd" inputmode="numeric" dir="ltr" placeholder="05xxxxxxxx" autocomplete="new-password"></div>
        <div class="p-err" id="lErr"></div>

async function doLogin(){
  const err = document.getElementById('lErr'), btn = document.getElementById('lBtn');
  const idEl = document.getElementById('l_id'), pwEl = document.getElementById('l_pwd');
  const show = m => { err.textContent = m; err.classList.add('show'); };
  const reset = () => { btn.disabled = false; btn.textContent = 'دخول'; };
  err.classList.remove('show');
  const lock = getLock(), now = Date.now();
  if(lock.until && now < lock.until){ show(`محاولات كثيرة — حاول بعد ${ar(Math.ceil((lock.until - now) / 1000))} ثانية`); return; }
  const id = normDigits(idEl.value), pw = normDigits(pwEl.value);
  btn.disabled = true; btn.textContent = 'جارٍ التحقق…';
  let session = null;
  try{
    if(id && pw){
      if(await checkAdmin(id, pw)){ ensureManagerEmployee(id); session = { role: 'admin' }; }
      else {
        const emp = state.employees.find(e => !e.isManager && e.nationalId && normDigits(e.nationalId) === id);
        if(emp && await checkEmployeePwd(emp, pw)) session = { role: 'employee', empId: emp.id };
      }
    }
  }catch(e){
    console.error(e); reset();
    show('تعذّر التحقق — افتح البرنامج من متصفح حديث وعبر رابط آمن');
    return;
  }
  if(!session){
    let fails = (lock.fails || 0) + 1, until = 0;
    if(fails >= 5){ until = now + 60000; fails = 0; }
    setLock({ fails, until });
    pwEl.value = '';
    reset();
    show('رقم الهوية أو رقم الجوال غير صحيح');
    return;
  }
  setLock({}); setSession(session); pConfirmOut = false;
  route();
}

function renderPortal(){
  stopClock();
  const host = document.getElementById('portal');
  if(!pSession || !state.employees.some(e => e.id === pSession)){ setSession(null); pSession = null; route(); return; }
  host.innerHTML = portalHomeHtml();
  tickClock(); pClock = setInterval(tickClock, 1000);
  if(pFocusReply){ const ta = document.getElementById('t_reply'); if(ta) ta.focus(); pFocusReply = false; }
}

function pTaskAct(kind, id){
  if(kind === 'open'){ pOpenTask = id; pDraft = ''; pFocusReply = true; renderPortal(); return; }
  if(kind === 'cancel'){ pOpenTask = null; pDraft = ''; renderPortal(); return; }
  const t = state.log.find(x => x.id === id && x.employeeId === pSession);
  if(!t || t.status === 'done'){ toast('تعذّر إرسال الرد على هذه المهمة'); pOpenTask = null; renderPortal(); return; }
  const ta = document.getElementById('t_reply');
  t.reply = ta ? ta.value.trim() : '';
  t.status = 'done';
  t.dateReplied = new Date().toISOString();
  t.repliedBy = 'employee';
  pOpenTask = null; pDraft = '';
  saveState();
  toast('تم تسجيل إنجاز المهمة ✓');
  renderPortal();
}

function pAct(kind){
  const emp = state.employees.find(e => e.id === pSession);
  if(!emp){ setSession(null); pSession = null; route(); return; }
  const ds = todayStr(), tm = nowTime();
  const rec = attFor(emp.id, ds);
  if(kind === 'in'){
    if(rec && rec.checkIn){ toast('سُجّل حضورك مسبقًا'); return; }
    if(rec) rec.checkIn = tm;
    else state.attendance.push({ id: uid(), employeeId: emp.id, employeeName: emp.name, date: ds, checkIn: tm, checkOut: '', note: '', src: 'self' });
    toast('تم تسجيل حضورك ✓');
  } else {
    if(!rec || !rec.checkIn){ toast('سجّل حضورك أولًا'); return; }
    if(rec.checkOut){ toast('سُجّل انصرافك مسبقًا'); return; }
    if(!pConfirmOut){
      pConfirmOut = true;
      clearTimeout(pConfirmT);
      pConfirmT = setTimeout(() => { pConfirmOut = false; if(pSession) renderPortal(); }, 4000);
      renderPortal();
      return;
    }
    if(toMin(tm) < toMin(rec.checkIn)){ toast('تعذّر تسجيل الانصراف — تواصل مع المسؤول'); pConfirmOut = false; renderPortal(); return; }
    rec.checkOut = tm;
    pConfirmOut = false; clearTimeout(pConfirmT);
    toast('تم تسجيل انصرافك ✓');
  }
  saveState();
  renderPortal();
}

function doLogout(){
  setSession(null); pSession = null; pConfirmOut = false;
  stopClock();
  if(location.hash) location.hash = '';
  route();
}

(function wireAuth(){
  document.getElementById('login').addEventListener('submit', e => {
    if(e.target.id !== 'lForm') return;
    e.preventDefault();
    doLogin();
  });

      const nid = normDigits(idEl.value);

      if(!nid && !ph) continue;
      if(nid.length !== 10){ toast(`رقم هوية «${emp.name}» يجب أن يكون ١٠ أرقام`); return; }
      if(ph.length !== 10){ toast(`رقم جوال «${emp.name}» غير صحيح — مثال: 05xxxxxxxx`); return; }
      if(seen.has(nid) || state.employees.some(x => x.id !== empId && x.nationalId && normDigits(x.nationalId) === nid)){
        toast(`رقم الهوية مسجّل لموظف آخر: «${emp.name}»`); return;
      }
      seen.add(nid); upd.push([emp, nid, ph]);
    }
    if(!upd.length){ toast('لم تُدخل أي بيانات'); return; }
    upd.forEach(([emp, nid, ph]) => { emp.nationalId = nid; emp.phone = ph; });
    saveState(); render();
    toast(`تم حفظ بيانات دخول ${ar(upd.length)} موظف ✓`);
  });

  /* تغيير بيانات دخول الإدارة من الإعدادات */
  document.getElementById('main').addEventListener('click', async e => {
    if(!e.target.closest('#saveAdminCred')) return;
    const id = normDigits(document.getElementById('ac_id').value);
    const pw = normPhone(document.getElementById('ac_pwd').value);
    const pw2 = normPhone(document.getElementById('ac_pwd2').value);
    if(id.length !== 10){ toast('رقم الهوية يجب أن يكون ١٠ أرقام'); return; }
    if(pw.length < 6 || pw.length > 10){ toast('الرقم السري (رقم الجوال) من ٦ إلى ١٠ أرقام'); return; }
    if(pw !== pw2){ toast('تأكيد الرقم السري غير مطابق'); return; }
    try{
      const cred = await makeCred(id, pw);
      localStorage.setItem(ADMIN_KEY, JSON.stringify(cred));
    }catch(err){ console.error(err); toast('تعذّر حفظ بيانات الدخول'); return; }
    ensureManagerEmployee(id);
    ['ac_id','ac_pwd','ac_pwd2'].forEach(k => { document.getElementById(k).value = ''; });
    toast('تم تحديث بيانات دخول الإدارة ✓ — استخدمها في الدخول القادم');
  });
})();

/* ---------- التوجيه حسب الجلسة ---------- */
function route(){
  stopClock();
  const body = document.body;
  body.classList.remove('portal-mode', 'login-mode');
  const s = getSession();
  if(!s){ body.classList.add('login-mode'); renderLogin(); return; }
  if(s.role === 'admin'){
    if(location.hash === '#employee'){
      const m = state.employees.find(e => e.isManager);
      if(m){ pSession = m.id; body.classList.add('portal-mode'); renderPortal(); return; }
    }
    render();
    return;
  }
  if(s.role === 'employee' && state.employees.some(e => e.id === s.empId)){
    pSession = s.empId;
    body.classList.add('portal-mode');
    renderPortal();
    return;
  }
  setSession(null);
  body.classList.add('login-mode');
  renderLogin();
}
window.addEventListener('hashchange', route);


/* ===================== Init ===================== */
document.querySelectorAll('img[data-logo]').forEach(i => { i.src = LOGO; });
route();
</script>
</body>
